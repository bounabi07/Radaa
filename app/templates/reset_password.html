<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 350px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); text-align: center; border: 1px solid #334155; }
        h3 { margin-bottom: 20px; color: #38bdf8; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #16a34a; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #15803d; }

                        .hero-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(180deg,
                    rgba(10, 14, 26, 0.40) 0%,
                    rgba(10, 14, 26, 0.30) 50%,
                    rgba(10, 14, 26, 0.30) 100%),
                url('{{ url_for('static', filename='images/res_mot.jpg')}}')
                center/cover no-repeat fixed;
        }
    </style>
</head>
<body>

     <div class="hero-bg"></div> 
    <div class="lang-menu-container">
        <div class="lang-circle-btn" onclick="toggleLangMenu()">🌐</div>
        <div class="lang-dropdown" id="langDropdown">
            <a href="javascript:void(0)" onclick="changeLanguage('ar')">العربية (AR)</a>
            <a href="javascript:void(0)" onclick="changeLanguage('en')">English (EN)</a>
            <a href="javascript:void(0)" onclick="changeLanguage('fr')">Français (FR)</a>
            <a href="javascript:void(0)" onclick="changeLanguage('ary')">الدارجة (ARY)</a>
        </div>
    </div>


    <div class="hero-bg"></div>
   <div class="card">
   
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-messages" style="margin-bottom: 15px;">
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}" style="
            padding: 10px; 
            border-radius: 5px; 
            font-size: 14px; 
            text-align: center;
            color: #fff;
            background-color: {% if category == 'danger' %}#e74c3c{% else %}#2ecc71{% endif %};">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

        <h3><i class="fa-solid fa-lock-open"></i> <span data-i18n="reset_title">New Password</span></h3>
        <form method="POST">
            <input type="password" name="password" data-i18n-placeholder="reset_new_password_placeholder" placeholder="New Password" required minlength="6">
            <input type="password" name="confirm_password" data-i18n-placeholder="reset_confirm_placeholder" placeholder="Confirm New Password" required minlength="6">
            <button type="submit" data-i18n="reset_update_btn">Update Password</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
